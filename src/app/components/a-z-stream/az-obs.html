<html>
    <head>
        <title>A-Z Stream Gauntlet | OBS Promo</title>
        <link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@600;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="gauntlet-panel">
            <div class="gauntlet-row">
                
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1784.63 826.00" width="1785" height="826" role="img" aria-label="A-Z" xmlns-c2pa="http://c2pa.org/manifest">
                <title>A-Z</title>
                <desc>A-Z</desc>
                <g fill="#fff">
                    <path id="A_left" d="M268.56 45.32 L341.92 269.00 L245.26 550.00 L434.09 550.00 L470.66 661.50 L216.00 661.50 L193.29 727.51 L0.00 826.00 Z"/>
                    <path id="A_right" d="M290.00 0.00 L460.79 87.02 L715.00 826.00 L530.01 731.74 Z"/>
                    <path id="dash" d="M722.28 348.00 L994.28 348.00 L1080.09 478.00 L808.08 478.00 Z"/>
                    <path id="Z_top" d="M1170.00 7.50 L1581.29 7.50 L1500.11 130.50 L1251.18 130.50 Z"/>
                    <path id="Z_diag" d="M1622.63 7.50 L1784.63 7.50 L1249.37 818.50 L1087.37 818.50 Z"/>
                    <path id="Z_bottom" d="M1702.00 818.50 L1290.71 818.50 L1371.89 695.50 L1620.82 695.50 Z"/>
                </g>
            </svg>
                
                <div class="gauntlet-col">
                <div class="gauntlet-title">
                    <div>Stream</div>
                    <div>Gauntlet</div>
                </div>
                <div class="gauntlet-dates">Oct 23 - Nov 18</div>
                </div>
            </div>
            <div class="gauntlet-letters">
                <span class="completed">A</span>
                <span class="completed">B</span>
                <span class="completed">C</span>
                <span class="completed">D</span>
                <span class="completed">E</span>
                <span class="completed">F</span>
                <span class="completed">G</span>
                <span class="completed">H</span>
                <span class="on">I</span>
                <span class="">J</span>
                <span class="">K</span>
                <span class="">L</span>
                <span class="">M</span>
                <span class="">N</span>
                <span class="">O</span>
                <span class="">P</span>
                <span class="">Q</span>
                <span class="">R</span>
                <span class="">S</span>
                <span class="">T</span>
                <span class="">U</span>
                <span class="">V</span>
                <span class="">W</span>
                <span class="">X</span>
                <span class="">Y</span>
                <span class="">Z</span>
            </div>
            <!-- <div class="spooky-day-line">
                SPOOKY DAY
            </div> -->
        </div>

        <style>
            html, body {
                margin: 0;
                padding: 0;
            }
            .gauntlet-panel {
                --accent: #F2A93B;
                --spooky: #bb92f4;
                position: relative;
                width: 592px;
                height: 260px;
                box-sizing: border-box;
                padding: 28px;
                display: flex;
                flex-direction: column;
                background: rgba(24, 10, 14, 0.78);
                border: 1px solid rgba(255, 255, 255, 0.14);
                border-radius: 6px;
                color: #F6EDE6;
                font-family: "Saira Semi Condensed", system-ui, sans-serif;
            }
            .gauntlet-row {
                flex: 1;
                display: flex;
                align-items: stretch;
                gap: 22px;
                padding: 13px 0 42px;
                box-sizing: border-box;
            }
            .gauntlet-row > svg {
                display: block;
                width: 270px;
                height: auto;
                flex: none;
            }
            .gauntlet-col {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }
            .gauntlet-title {
                font-size: 48px;
                font-weight: 700;
                line-height: 0.95;
                color: var(--accent);
                /* color: var(--spooky); */
                margin-top: -5px;
            }
            .gauntlet-dates {
                font-size: 22px;
                font-weight: 600;
                line-height: 1;
                color: #E4D5CC;
                margin-bottom: -4px;
            }
            .gauntlet-letters {
                position: relative;
                display: flex;
                justify-content: space-between;
                font-family: "Saira Stencil One", sans-serif;
                font-size: 22px;
                line-height: 1;
                color: #9C8880;
                /* filter: blur(5px); */
            }
            .gauntlet-letters span:not(.completed):not(.on) {
                filter: brightness(1.3);
            }
            .gauntlet-letters .completed {
                opacity: 0.7;
                text-decoration: line-through;
            }
            .gauntlet-letters .on {
                color: var(--accent);
                /* color: var(--spooky); */
            }
            .spooky-day-line {
                position: absolute;
                bottom: 16px;
                width: 100%;
                text-align: center;
                left: 0;
                font-size: 30px;
                color: white;
                background: radial-gradient(#9d6ede 0%, transparent 62%);
            }
        </style>
    </body>
</html>
